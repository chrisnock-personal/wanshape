[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wanshape"
version = "0.4.0"
description = "Apply netem/tc WAN impairments to one container, one service's ports, or one libvirt VM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris" }]
keywords = ["netem", "tc", "network emulation", "wan", "podman", "docker", "libvirt", "voip", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/chrisnock-personal/wanshape"
Issues = "https://github.com/chrisnock-personal/wanshape/issues"

[project.scripts]
wanshape = "wanshape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
